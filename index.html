<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picture Game – Kru Kristel</title>
<style>
:root{--bg:#f2f6ff;--card:#fff;--ink:#241a33;--mut:#5f5f82;--pri:#7b2d8e;--pri2:#f3e4f7;--sec:#2b6cd9;--sec2:#e2ecff;--ok:#1f9d55;--bad:#d64545;--bd:#cbd9f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172a;--card:#1f2440;--ink:#f3eefb;--mut:#b9b8d6;--pri:#d08ae3;--pri2:#3b2646;--sec:#7fb0ff;--sec2:#233258;--bd:#38426b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14172a;--card:#1f2440;--ink:#f3eefb;--mut:#b9b8d6;--pri:#d08ae3;--pri2:#3b2646;--sec:#7fb0ff;--sec2:#233258;--bd:#38426b;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
#app{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:clamp(22px,5vw,34px);margin:6px 0;background:linear-gradient(90deg,var(--pri),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent}
body{border-top:6px solid transparent;border-image:linear-gradient(90deg,#7b2d8e,#2b6cd9) 1}
.logo{width:96px;height:96px;border-radius:20px;border:3px solid var(--sec);object-fit:cover}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin:12px 0}
.teams{display:flex;gap:8px;flex-wrap:wrap}
.team{flex:1;min-width:110px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px;text-align:center}
.team.cur{border-color:var(--sec);background:var(--sec2)}.team.out{opacity:.45}
.team b{display:block}.hearts{font-size:20px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#7b2d8e,#2b6cd9);color:#fff;cursor:pointer;margin:4px}
button.alt{background:var(--sec2);color:var(--sec)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button:disabled{opacity:.4;cursor:default}
.big{font-size:clamp(22px,5vw,34px);font-weight:700;line-height:1.4}
.pic{font-size:110px;text-align:center;min-height:130px}
.hide{filter:blur(0);opacity:.9}
.slot{min-height:56px;border:2px dashed var(--bd);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile{background:var(--sec2);color:var(--ink);border:2px solid var(--sec);padding:8px 14px;font-size:20px;margin:0}
.msg{font-size:20px;font-weight:700;padding:10px;border-radius:12px;margin-top:8px}
.msg.g{background:#d9f5e3;color:#14663a}.msg.r{background:#fde0e0;color:#8f2323}
.mut{color:var(--mut)}input,select{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--ink);margin:4px;width:min(260px,90%)}
.c{text-align:center}
.pics{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}.pc{width:min(150px,28vw);height:min(150px,28vw);border-radius:20px;border:3px solid var(--sec);display:flex;align-items:center;justify-content:center;font-size:min(88px,16vw);background:var(--sec2);overflow:hidden}.pc img{width:100%;height:100%;object-fit:cover}
.boxes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.box{font-size:48px;padding:14px 22px;margin:0}
</style></head><body><div id="hb" style="max-width:900px;margin:0 auto;padding:10px 14px 0;display:none"><img id="hl" class="logo" style="width:44px;height:44px;border-radius:10px;border-width:2px;vertical-align:middle;margin-right:6px" alt="Kru Kristel"><button id="hbb" class="alt" onclick="goHome()">🏠 Home</button><button id="nxb" class="alt" onclick="skipRound()">⏭ Next round</button></div><div id="app"></div>

async function loadAU(){DB=await idb();if(!DB)return;await new Promise(res=>{try{const q=DB.transaction("a").objectStore("a").openCursor();q.onsuccess=()=>{const u=q.result;if(u){AU[u.key]=u.value;u.continue()}else res()};q.onerror=()=>res()}catch(e){res()}})}

function bar(){return '<div class="teams">'+T.map((t,k)=>`<div class="team ${k==c&&ph=="play"?"cur":""}" style="cursor:pointer" onclick="sel(${k})"><b>${esc(t.name)}</b><div class="big" style="font-size:26px">⭐ ${t.score}</div></div>`).join("")+"</div>"}
function setup(){ph="setup";names=names.length?names:Array.from({length:count},(_,k)=>"Group "+(k+1));while(names.length<count)names.push("Group "+(names.length+1));names.length=count;
$().innerHTML=`<div style="display:flex;align-items:center;gap:14px"><img class="logo" src="${LOGO}" alt="Kru Kristel logo"><h1>${esc(C.title)}</h1></div><p class="mut">Kru Kristel · Game 2 · 3 rounds · mystery boxes</p><div class="card"><b>How many groups?</b><br>${[2,3,4,5,6].map(n=>`<button class="${n==count?"":"alt"}" onclick="count=${n};setup()">${n}</button>`).join("")}<div>${names.map((n,k)=>`<input value="${esc(n)}" onchange="names[${k}]=this.value" aria-label="Group name">`).join("")}</div><button onclick="startGame()">Start Game ▶</button><br><button class="alt" onclick="editor()">✏️ Edit game &amp; pictures</button></div>`}
function startGame(){T=names.map(n=>({name:n||"Group",score:0}));rd=1;intro()}
function intro(){ph="intro";c=-1;
$().innerHTML=bar()+`<div class="card c"><h1>Round ${rd}</h1><div class="big">${TT[rd]}</div><p class="mut">${["","Look at the pictures and say the sentence!","Look at the sport and the describing picture. Say the sentence!","Which word fits: play, go or do? Say the sentence!"][rd]}</p><p>🎁 Answer correctly to open a mystery box. Keep the prize or give it to another group!</p><button onclick="startRound()">Go! ▶</button></div>`}
function startRound(){i=0;show()}
function show(){ph="play";c=-1;fb=null;rev=false;bx=null;render()}
function sel(k){if(ph!="play"||fb||bx)return;c=k;render()}
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const lab=v=>v=="x2"?"✖️2 Double points":(v>0?"+"+v:String(v));
function render(){const L=R(rd),it=L[i],t=T[c]||null;
let h=bar()+`<div class="card"><div class="mut">Round ${rd}: ${TT[rd]} · Item ${i+1}/${L.length} · ${t?`<b>${esc(t.name)}</b>’s turn`:"👆 Tap a group to choose who answers"}</div><div class="pics">${it.p.map(pic).join("")}</div>`;
if(!bx){h+=rev?`<div class="big c" style="margin:10px 0">${esc(it.t)}</div><div class="c"><button class="alt" onclick="speak(R(rd)[i].t)">🔊 Listen</button></div>`:`<div class="c"><button onclick="rev=true;render();speak(R(rd)[i].t)">👀 Show the sentence</button></div>`;
if(rev&&!fb)h+=`<div class="c"><button class="ok" ${c<0?"disabled":""} onclick="mark(true)">✔ Correct</button><button class="bad" ${c<0?"disabled":""} onclick="mark(false)">✘ Wrong</button></div>`}
else{h+=`<div class="big c" style="margin:10px 0">${esc(it.t)}</div>`;
if(bx.s=="pick")h+=`<div class="c big">🎁 ${esc(t.name)}, pick a mystery box!</div><div class="boxes">${bx.p.map((_,k)=>`<button class="box" onclick="openBox(${k})">🎁</button>`).join("")}</div>`;
else if(bx.s=="decide")h+=`<div class="c"><div style="font-size:72px">🎁</div><div class="big">Decide before opening!</div><p class="mut">Does ${esc(t.name)} keep the mystery box, or give it to another group?</p><button class="ok" onclick="keep(${c})">✅ Keep it</button><button onclick="bx.s='give';render()">🎁 Give it away</button></div>`;
else if(bx.s=="give")h+=`<div class="c big">Give the mystery box to:</div><div class="c">${T.map((x,k)=>k==c?"":`<button onclick="keep(${k})">${esc(x.name)}</button>`).join("")}</div>`}
if(bx&&bx.s=="done")h+=`<div class="c"><div style="font-size:64px">🎁</div><div class="big">Inside: ${lab(bx.v)}</div></div>`;
if(fb)h+=`<div class="msg ${fb.ok?"g":"r"}">${fb.m}</div><div class="c"><button onclick="adv()">Next ▶</button></div>`;
$().innerHTML=h+"</div>"}
function mark(ok){if(c<0)return;if(!ok){fb={ok:false,m:"❌ Not quite. Say it together!"};render()}else{bx={p:shuf(C.prizes||PRIZES),s:"pick"};render()}}
function openBox(k){bx.v=bx.p[k];bx.s="decide";render()}
function keep(k){const v=bx.v,t=T[k],before=t.score;if(v=="x2"){if(t.score>0)t.score*=2}else t.score+=v;
const who=k==c?esc(t.name)+" keeps":esc(T[c].name)+" gives "+(v=="x2"?"✖️2":lab(v))+" to "+esc(t.name)+" —";
fb={ok:t.score>=before,m:`${k==c?who+" "+lab(v)+"!":who} ${esc(t.name)} now has ⭐ ${t.score}`};bx.s="done";render()}
function adv(){i++;if(i>=R(rd).length)return roundEnd();show()}
function roundEnd(){ph="end";const last=rd==3,mx=Math.max(...T.map(t=>t.score));
$().innerHTML=bar()+`<div class="card c"><h1>${last?"🏆 Game Over!":"Round "+rd+" complete"}</h1>${last?`<div class="big">Winner: ${T.filter(t=>t.score==mx).map(t=>esc(t.name)).join(" & ")} with ${mx} ⭐</div>`:`<p>Scores carry over to the next round!</p>`}<button onclick="${last?"setup()":"rd++;intro()"}">${last?"Play again":"Next round ▶"}</button></div>`}
const TA='style="width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--ink)"';
const thumb=j=>{const n=PN[j],u=imgU(n);return u?`<img src="${u}" style="width:56px;height:56px;object-fit:cover;border-radius:10px">`:`<span style="font-size:36px">${esc(C.sy[n]||"❓")}</span>`};
function editor(){ph="editor";PN=[...new Set([...C.r1,...C.r2.flat(),...C.r3.map(x=>x[1])])];
$().innerHTML=`<h1>✏️ Edit game &amp; pictures</h1><p class="mut">One item per line. Saved in this browser.</p><button class="alt" onclick="setup()">← Back</button>
<div class="card"><b>Game title</b><br><input id="e0" style="width:95%" value="${esc(C.title)}"></div>
<div class="card"><b>Round 1 “I like ___”: one sport per line</b><textarea id="e1" rows="8" ${TA}>${esc(C.r1.join("\n"))}</textarea></div>
<div class="card"><b>Round 2 “___ is ___”: sport | describing word</b><textarea id="e2" rows="8" ${TA}>${esc(C.r2.map(x=>x.join(" | ")).join("\n"))}</textarea></div>
<div class="card"><b>Round 3 “I play/go/do ___”: verb | sport</b><textarea id="e3" rows="8" ${TA}>${esc(C.r3.map(x=>x.join(" | ")).join("\n"))}</textarea></div>
<div class="card"><b>Emoji for each word: word | emoji</b><textarea id="e4" rows="8" ${TA}>${esc(Object.entries(C.sy).map(x=>x.join(" | ")).join("\n"))}</textarea></div>
<div class="card"><b>🎁 Mystery box prizes</b><p class="mut">One prize per line: a number (like 100 or -500) or the word double. Each prize becomes one box (2 to 12 prizes).</p><textarea id="e5" rows="8" ${TA}>${esc((C.prizes||PRIZES).map(p=>p=="x2"?"double":p).join("\n"))}</textarea></div>
<div id="em" class="msg r" style="display:none"></div><button onclick="saveEd()">💾 Save</button><button class="alt" onclick="C=JSON.parse(JSON.stringify(DEF));try{localStorage.removeItem(LS)}catch(e){}editor()">Reset</button>
<div class="card"><b>Your own pictures</b><p class="mut">Upload a photo for any word; it replaces the emoji. Save text changes first.</p>${PN.map((n,j)=>`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bd);padding:6px 0"><span id="th${j}" style="width:60px;text-align:center">${thumb(j)}</span><span style="flex:1;min-width:100px">${esc(n)}</span><button class="alt" onclick="this.nextElementSibling.click()">📁 Upload</button><input type="file" accept="image/*" hidden onchange="imgUp(${j},this)"><button class="alt" onclick="imgDel(${j})">🗑</button></div>`).join("")}</div>`}
function prz(v){const a=v.split("\n").map(x=>x.trim().toLowerCase().replace(/−/g,"-")).filter(Boolean).map(x=>/^(x2|×2|✖️2|double)/.test(x)?"x2":(isFinite(x)?Number(x):NaN));return a.length>=2&&a.length<=12&&!a.some(Number.isNaN)?a:null}
function saveEd(){const g=id=>document.getElementById(id).value,ln=v=>v.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>x.split("|").map(y=>y.trim())),lc=a=>a.map(y=>y.toLowerCase());
const r1=ln(g("e1")).map(p=>p[0].toLowerCase()),r2=ln(g("e2")).map(lc),r3=ln(g("e3")).map(lc),sy={};ln(g("e4")).forEach(p=>{if(p[0]&&p[1])sy[p[0].toLowerCase()]=p[1]});
const em=document.getElementById("em");let bad="";
if(!r1.length)bad="Round 1 needs at least one sport.";else if(!r2.length||r2.some(p=>p.length<2||!p[0]||!p[1]))bad="Round 2: every line needs sport | describing word.";else if(!r3.length||r3.some(p=>p.length<2||!p[0]||!p[1]))bad="Round 3: every line needs verb | sport.";
const pz=prz(g("e5"));if(!bad&&!pz)bad="Mystery box prizes: use numbers (like 100 or -500) or the word double, one per line (2 to 12 prizes).";if(bad){em.textContent=bad;em.style.display="block";return}
C={title:g("e0").trim()||DEF.title,sy,r1,r2,r3,prizes:pz};try{localStorage.setItem(LS,JSON.stringify(C))}catch(e){}setup()}
function imgUp(j,el){const f=el.files[0];if(!f)return;const n=PN[j],im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const m=Math.min(1,500/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*m);cv.height=Math.round(im.height*m);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>{delete IU["s-"+n];saveAU("s-"+n,b);document.getElementById("th"+j).innerHTML=thumb(j)},f.type=="image/png"?"image/png":"image/jpeg",.85);URL.revokeObjectURL(u)};im.src=u}
function imgDel(j){const n=PN[j];delete IU["s-"+n];delAU("s-"+n);document.getElementById("th"+j).innerHTML=thumb(j)}
function goHome(){const b=document.getElementById("hbb");if(b.dataset.s){clearTimeout(hbT);b.dataset.s="";b.textContent="🏠 Home";try{speechSynthesis.cancel()}catch(e){}setup();return}b.dataset.s="1";b.textContent="Tap again to leave (scores reset)";hbT=setTimeout(()=>{b.dataset.s="";b.textContent="🏠 Home"},3000)}
function skipRound(){const b=document.getElementById("nxb");if(b.dataset.s){clearTimeout(nxT);b.dataset.s="";if(rd<3){rd++;intro()}else roundEnd();return}b.dataset.s="1";b.textContent="Tap again to confirm";nxT=setTimeout(()=>{b.dataset.s="";b.textContent=rd<3?"⏭ Next round":"🏁 Finish game"},3000)}
new MutationObserver(()=>{document.getElementById("hb").style.display=(ph=="setup"||ph=="editor")?"none":"block";const n=document.getElementById("nxb");n.style.display=(ph=="play"||ph=="intro")?"inline-block":"none";if(!n.dataset.s)n.textContent=rd<3?"⏭ Next round":"🏁 Finish game"}).observe(document.getElementById("app"),{childList:true});
document.getElementById("hl").src=LOGO;document.title=C.title;loadAU().finally(setup);
</script></body></html>
